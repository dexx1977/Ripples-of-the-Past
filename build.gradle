plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = release_snapshot.toBoolean() ? "${mc_version}-${mod_version}-snapshot-${snapshot_version}" : "${mc_version}-${mod_version}"
group = 'standobyte.jojo'
archivesBaseName = 'JJBA-RipplesOfThePast'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    mappings channel: 'official', version: mc_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file("run-${name}")
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            mods {
                jojo { source sourceSets.main }
            }
        }
        client {}
        client2 {
            parent runs.client
            args '--username', 'ROTPTestPlayer2'
        }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'jojo' }
        data {
            args '--mod', 'jojo', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, 'mixins.jojo.refmap.json'
    config 'mixins.jojo.json'
    
    debug.verbose = true
    debug.export = true
    dumpTargetOnFailure = true
}

repositories {
    mavenCentral()
    maven {
        // MixinExtras 0.1.1 is only published under its original JitPack
        // coordinate, which ExpandAbility's module metadata still requires.
        name = "JitPack"
        url = "https://jitpack.io"
        content { includeGroupByRegex "com\\.github\\.LlamaLad7" }
    }
    maven {
        name = "KosmX's maven"
        url = "https://maven.kosmx.dev/"
        content { includeGroupByRegex "dev\\.kosmx.*"; includeGroupByRegex "io\\.github\\.kosmx.*" }
    }
//    flatDir {
//        dirs 'lib/dev/kosmx/player-anim/player-animation-lib-forge/0.4.0+1.16.5'
//        dirs 'lib/io/github/kosmx/bendy-lib/bendy-lib-forge/1.2.2'
//    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content { includeGroup "mezz.jei"; includeGroupByRegex "net\\.mezzdev.*" }
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
        content { includeGroup "mezz.jei" }
    }
    maven { // Vampirism
        name = "Maxanier"
        url = "https://maven.maxanier.de/releases/"
        content { includeGroupByRegex "de\\.teamlapen.*" }
    }
    maven {
        name = "Expandability"
        url = "https://maven.florens.be/releases"
        content { includeGroup "be.florens" }
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${playeranim_version}")
    implementation fg.deobf("io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}")
    compileOnly 'org.jetbrains:annotations:23.0.0'
    
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")
    
    compileOnly fg.deobf("de.teamlapen.vampirism:Vampirism:${mc_version}-${vampirism_version}")
    
    // Only the fluid-collision event API is used. ExpandAbility bundles its own
    // MixinExtras implementation; its old JitPack coordinate is not a dev API.
    compileOnly(fg.deobf("be.florens:expandability-forge:${expandability_version}")) {
        transitive = false
    }
    
    shade 'team.unnamed:mocha:3.0.1'
}


// Minifies json resource files
import groovy.json.JsonSlurper
import groovy.json.JsonOutput

processResources {
	inputs.property "version", project.version

    doLast {
        fileTree(dir: outputs.files.asPath, include: "**/*.json").each {
            File file -> file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
        }
    }
}


jar {
	archiveClassifier = 'unbundled'
    manifest {
        attributes([
            "Specification-Title": "Ripples of the Past",
            "Specification-Vendor": "StandoByte",
            "Specification-Version": "1", 
            "Implementation-Title": "com.github.standobyte.jojo",
            "Implementation-Version": "${mod_version}",
            "Implementation-Vendor" :"StandoByte",
            "MixinConfigs": "mixins.jojo.json",
        ])
    }
}

// 1.20.1 loads mods in a module layer, and a library that only sits on the plain
// classpath cannot be read from the mod's development module. Unpacking the
// shaded library into the mod's own output keeps the release jar unchanged (the
// shaded copy is relocated and the plain one is excluded below), while giving the
// development runs the classes inside the mod's module.
tasks.register('unpackDevLibs', Copy) {
    from { configurations.shade.collect { zipTree(it) } }
    into layout.buildDirectory.dir('classes/java/main')
    include 'team/unnamed/mocha/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
classes.dependsOn 'unpackDevLibs'

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'team.unnamed.mocha', "dependency.${project.group}.mocha"
    exclude 'javassist*'
    finalizedBy 'reobfShadowJar'
}

assemble.dependsOn shadowJar

reobf {
    shadowJar {}
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar') 
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

task srcJar (type: Jar) {
    from sourceSets.main.java
    archiveClassifier = 'sources'
}

artifacts {
    archives srcJar
}

tasks.withType(GenerateModuleMetadata) {
	// Gradle metadata generates with dependencies which causes an error, 
	// and I CBA to figure out how to fix it when this works
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version "${mc_version}-${mod_version}-snapshot-${snapshot_version}"
            from components.java
            artifact srcJar
            pom.withXml {
                def node = asNode()
                if (node.dependencies.size() > 0)
                    node.remove(node.dependencies) // Remove dependencies from .pom
            }
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Forking lets us force an English diagnostic locale, so porting notes and
    // CI logs stay greppable, and lets the first passes report every error.
    options.fork = true
    options.forkOptions.jvmArgs = ['-Duser.language=en', '-Duser.country=US']
    options.compilerArgs += ['-Xmaxerrs', '12000']
}
